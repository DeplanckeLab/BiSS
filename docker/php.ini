; BiSS PHP settings, loaded after php.ini-production.

; --- php2shell (CVE-2026-109618 / CVE-2026-109619) ---------------------
; The real fix is PHP >= 8.5.12 (enforced at build time). The settings below
; are the advisory's no-cost mitigations, kept as defence in depth.
; BiSS never uses upload progress tracking.
session.upload_progress.enabled = 0
; PHP 8.5 only: no backtraces on fatal errors.
fatal_error_backtraces = 0
; Keep request bodies small: BiSS only receives FASTA text (10 kb per sequence).
; Apache also enforces LimitRequestBody and rejects chunked bodies (see
; apache-biss.conf), so post_max_size cannot be bypassed.
post_max_size = 8M
upload_max_filesize = 4M
max_file_uploads = 1
; The forms only have two flat fields ("sequence" and "fasta").
max_input_vars = 50
max_input_nesting_level = 4

; --- General hardening -----------------------------------------------------
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
allow_url_fopen = Off
allow_url_include = Off
; Only exec() is needed (to start run_fimo.sh in the background).
disable_functions = passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork
open_basedir = /var/www/html:/data/biss:/tmp

; --- Sessions ----------------------------------------------------------------
; The session ID names the user's job folder, so never accept IDs chosen by
; the client. gc_maxlifetime is set at startup from BISS_RETENTION_DAYS.
session.save_path = /data/biss/sessions
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
