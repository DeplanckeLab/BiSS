# BiSS Apache settings (loaded last, after the image's security.conf)

ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# --- php2shell (CVE-2026-109618 / CVE-2026-109619) defence in depth --------
# The attack needs a request body larger than post_max_size, which is only
# possible with chunked HTTP/1.1 or length-less HTTP/2 requests.
# 1) HTTP/1.1 only (no h2/h2c).
Protocols http/1.1
# 2) Hard cap on any request body (slightly above post_max_size = 8M).
LimitRequestBody 9437184
# 3) Browsers never send chunked bodies for form posts: refuse them.
<If "%{HTTP:Transfer-Encoding} =~ /chunked/i">
	Require all denied
</If>

<Directory /var/www/html>
	Options -Indexes -MultiViews
	AllowOverride None
	Require all granted
</Directory>

# Scripts, include-only PHP files and data helpers are not web pages
<FilesMatch "\.(sh|py|rb|ini|original)$|^(variables|php_utils|bio_utils|top_bar)\.php$|^(NAME|present)$">
	Require all denied
</FilesMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "same-origin"
