# BiSS: docker compose up -d --build
# Settings can be overridden in a .env file next to this one (see README.md).
services:
  web:
    build: .
    image: biss:latest
    restart: unless-stopped
    init: true
    ports:
      - "${BISS_PORT:-80}:80"
    environment:
      BISS_RETENTION_DAYS: ${BISS_RETENTION_DAYS:-7}
    volumes:
      - biss-data:/data/biss

  # Deletes jobs older than BISS_RETENTION_DAYS (replaces the old cron_script.sh)
  cleanup:
    image: biss:latest
    restart: unless-stopped
    init: true
    user: www-data
    command: ["biss-cleanup", "--loop"]
    healthcheck:
      disable: true
    environment:
      BISS_RETENTION_DAYS: ${BISS_RETENTION_DAYS:-7}
      BISS_CLEANUP_INTERVAL: ${BISS_CLEANUP_INTERVAL:-3600}
    volumes:
      - biss-data:/data/biss
    depends_on:
      - web

volumes:
  biss-data:
